[workspace]
members = [
    "crates/confval",
    "crates/confval-derive",
    "crates/snakeway",
    "crates/snakeway-conf",
    "crates/snakeway-core",
    "crates/snakeway-net",
    "crates/snakeway-tests",
    "crates/snakeway-jwt-auth-device",
    "crates/snakeway-wasm-test-device",
    "crates/snakeway-acme", "crates/snakeway-observability",
]
default-members = ["crates/snakeway"]
exclude = [
    "crates/snakeway-wit",
]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "Apache-2.0"

[profile.dev]
opt-level = 0

# Cranelift compiles WASM device modules at proxy startup.
# Unoptimized, that compilation takes ~50s per test process for a real
# device fixture, so keep the compilation-path crates optimized even in
# dev/test builds.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.release]
opt-level = 3               # Maximize performance
debug = true                # Keep debug symbols for profiling
split-debuginfo = "packed"  # Create .dwp alongside the binary
lto = "fat"                 # Link-time optimization
codegen-units = 1           # More aggressive optimization by reducing parallelism
panic = "abort"             # Reduce panic handling code
incremental = false         # Ensure no incremental compilation
overflow-checks = true      # Ensure safer arithmetic operations

[profile.dist]
inherits = "release"
debug = false               # No debug symbols in distributed binaries
strip = "symbols"           # Strip symbols to minimize binary size


[workspace.dependencies]
confval = { path = "crates/confval", features = ["serde", "color", "hcl", "derive"] }
snakeway-acme = { path = "crates/snakeway-acme" }
snakeway-conf = { path = "crates/snakeway-conf" }
snakeway-core = { path = "crates/snakeway-core" }
snakeway-net = { path = "crates/snakeway-net" }
snakeway-observability = { path = "crates/snakeway-observability" }

anyhow = "1.0"
async-trait = "0.1"
arc-swap = "1.7"
brotli = "8"
bytes = "1.11"
clap = "4.5"
config = "0.15"
console-subscriber = "0.5"
ctrlc = "3"
flate2 = "1.0"
http = "1.4"
httpdate = "1.0"
maxminddb = "0.27"
nix = "0.31"
mime_guess = "2.0.5"
percent-encoding = "2"
pingora = "0.8"
pingora-http = "0.8"
pingora-openssl = "0.8"
openssl = "0.10"
pingora-limits = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.52.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
uaparser = "0.6"
wasmtime = "46"
wasmtime-wasi = "46"
wit-bindgen = "0.58"
woothee = "0.13"
ipnet = "2.11"
ipnet-trie = "0.3"
thiserror = "2.0"
glob = "0.3"
serde_yaml = "0.9"
once_cell = "1.21.3"
rand = "0.10"
ahash = "0.8"
dashmap = "7.0.0-rc2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
hcl-rs = "0.19"
owo-colors = "4"
tempfile = "3"
pretty_assertions = "1"
uuid = "1.19.0"
smallvec = { version = "1.15.1", features = ["serde"] }
instant-acme = "0.8"
rcgen = "0.14"
sha2 = "0.11"
x509-parser = "0.18.1"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"
criterion = { version = "0.8", features = ["html_reports"] }
hostname = "0.4.2"
reqwest = { version = "0.13" }
tonic = { version = "0.14.2" }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.31"
prost = "0.14"
tonic-prost = "0.14"
hex = "0.4"
hotpath = "0.19.1"
secrecy = "0.10"
subtle = "2.6"
