receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

  otlp/tempo:
    endpoint: snakeway-tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://snakeway-loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      exporters: [ debug, otlp/tempo ]

    logs:
      receivers: [ otlp ]
      exporters: [ debug, otlphttp/loki ]
