apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://snakeway-tempo:3200
    isDefault: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'

  - name: Loki
    type: loki
    url: http://snakeway-loki:3100
    uid: loki
