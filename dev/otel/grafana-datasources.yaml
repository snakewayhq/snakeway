apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://snakeway-tempo:3200
    isDefault: true
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'

  - name: Loki
    type: loki
    url: http://snakeway-loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View Trace in Tempo

  - name: Prometheus
    type: prometheus
    url: http://snakeway-prometheus:9090
    uid: prometheus
