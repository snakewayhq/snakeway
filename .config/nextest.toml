[profile.ci.junit]
path = "junit.xml"
report-name = "snakeway-tests"

# The ACME HTTP-01 test polls for certificate issuance from Pebble.
# A transient first-attempt failure triggers a 20-second backoff before
# retry, so the test may need up to ~90 seconds in CI.
[[profile.ci.overrides]]
filter = "test(acme::http01)"
slow-timeout = { period = "120s", terminate-after = 1 }

# WASM device tests compile their fixture module with Cranelift at server startup.
# Terminate instead of hanging until the CI job timeout if that compile regresses.
[[profile.ci.overrides]]
filter = "test(device::wasm)"
slow-timeout = { period = "60s", terminate-after = 3 }

# Every ACME test binds the redirect listener on Pebble's fixed HTTP-01 port 5002.
# Two ACME tests that run at the same time fail to bind that port.
# The acme test group runs them one at a time.
[test-groups]
acme = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/^acme::/)"
test-group = "acme"
