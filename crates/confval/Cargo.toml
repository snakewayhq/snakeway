[package]
name = "confval"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Span-first configuration parsing, validation, and lowering for Rust"
repository = "https://github.com/snakewayhq/snakeway"
readme = "README.md"
keywords = ["configuration", "validation", "config"]
categories = ["config", "development-tools"]

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
color = ["dep:owo-colors"]
# Format frontends are independent opt-ins.
# The derive macro emits the format-neutral `FromFields`, so `derive` needs no frontend.
# tldr; pick `hcl` and/or `toml` for the format(s) you actually parse.
hcl = ["dep:hcl-edit"]
toml = ["dep:toml_edit"]
derive = ["dep:confval-derive"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
owo-colors = { version = "4", optional = true }
hcl-edit = { version = "0.9", optional = true }
toml_edit = { version = "0.25", optional = true }
confval-derive = { version = "0.1.1", path = "../confval-derive", optional = true }

[dev-dependencies]
hcl-edit = "0.9"
trybuild = "1"

[[example]]
name = "hcl"
required-features = ["derive", "color", "hcl"]

[[example]]
name = "toml"
required-features = ["derive", "color", "toml"]

[[test]]
name = "compile_fail"
required-features = ["derive"]

[[test]]
name = "hcl_end_to_end"
required-features = ["derive", "hcl"]
