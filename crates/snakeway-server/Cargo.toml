[package]
name = "snakeway-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
# Development-only config templates (`config init --template dev`).
# Off by default so production builds do not expose the pebble/repo-coupled template.
dev-templates = []

[dependencies]
confval = { workspace = true }
snakeway-acme = { workspace = true }
snakeway-conf = { workspace = true }
snakeway-engine = { workspace = true }
snakeway-observability = { workspace = true }
snakeway-proxy = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = { workspace = true }
http = { workspace = true }
nix = { workspace = true, features = ["signal"] }
pingora = { workspace = true, features = ["proxy", "openssl_derived", "openssl"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "rt",
    "sync",
    "signal",
    "macros",
    "tracing"
] }
tracing = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
hcl-rs = { workspace = true }
url = { workspace = true }
hotpath = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "router"
harness = false

[[bench]]
name = "device_pipeline"
harness = false

[[bench]]
name = "request_filter"
harness = false

[[bench]]
name = "identity"
harness = false

[[bench]]
name = "header_scaling"
harness = false

[package.metadata.cargo-machete]
ignored = ["hcl-rs"]
