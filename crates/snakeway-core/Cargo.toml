[package]
name = "snakeway-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
wasm = [
    "wasmtime",
]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
snakeway-conf = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
brotli = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
console-subscriber = { workspace = true }
ctrlc = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
maxminddb = { workspace = true, features = ["mmap"] }
mime_guess = { workspace = true }
nix = { workspace = true, features = ["signal"] }
percent-encoding = { workspace = true }
pingora = { workspace = true, features = ["proxy", "openssl_derived", "openssl", "connection_filter"] }
openssl = { workspace = true }
pingora-limits = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "rt",
    "sync",
    "signal",
    "macros",
    "tracing"
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }
tracing-appender = { workspace = true }
uaparser = { workspace = true }
wasmtime = { workspace = true, optional = true }
woothee = { workspace = true }
ipnet = { workspace = true, features = ["serde"] }
ipnet-trie = { workspace = true }
thiserror = { workspace = true }
serde_yaml = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
ahash = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
hcl-rs = { workspace = true }
pretty_assertions = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
smallvec = { workspace = true }
instant-acme = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
x509-parser = { workspace = true }
url = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
hostname = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
hotpath = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "router"
harness = false

[[bench]]
name = "device_pipeline"
harness = false

[[bench]]
name = "request_filter"
harness = false

[[bench]]
name = "identity"
harness = false

[[bench]]
name = "header_scaling"
harness = false

[package.metadata.cargo-machete]
ignored = ["hcl-rs"]
