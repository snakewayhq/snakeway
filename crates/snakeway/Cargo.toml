[package]
name = "snakeway"
description = "Programmable reverse proxy built on Pingora"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# Development-only config templates (`config init --template dev`).
# Off by default so production builds do not expose the pebble/repo-coupled template.
dev-templates = []

[dependencies]
confval = { workspace = true }
snakeway-acme = { workspace = true }
snakeway-conf = { workspace = true }
snakeway-engine = { workspace = true }
snakeway-observability = { workspace = true }
snakeway-proxy = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
ctrlc = { workspace = true }
http = { workspace = true }
nix = { workspace = true, features = ["signal"] }
pingora = { workspace = true, features = ["proxy", "openssl_derived", "openssl"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "rt",
    "sync",
    "signal",
    "macros",
    "tracing"
] }
tracing = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
hcl-rs = { workspace = true }
url = { workspace = true }
hotpath = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "snakeway"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["hcl-rs"]

# ---------------------------------------------------------------------------
# Build a .deb package (cargo-deb)
#   cargo install cargo-deb
#   cargo deb -p snakeway [--no-build --target x86_64-unknown-linux-musl]
# ---------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "Ethan Hann <ethanhann@gmail.com>"
copyright = "2026, Ethan Hann"
license-file = ["../../LICENSE", "0"]
depends = "$auto"
extended-description = """\
Snakeway is a fast, composable reverse proxy built on Pingora.
It supports HTTP/HTTPS proxying, WebSocket and gRPC proxying,
static file serving, ACME/TLS automation, and a device middleware pipeline."""
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/maintainer-scripts"
systemd-units = { unit-scripts = "../../packaging/systemd", enable = true }
assets = [
    # Binary
    ["target/release/snakeway", "usr/bin/snakeway", "755"],
    # Config skeleton
    ["../../packaging/config/snakeway.hcl", "etc/snakeway/snakeway.hcl", "644"],
    ["../../packaging/config/device.d/structured_logging.hcl", "etc/snakeway/device.d/structured_logging.hcl", "644"],
    ["../../packaging/config/ingress.d/example.hcl", "etc/snakeway/ingress.d/example.hcl", "644"],
]
# These files are preserved on package upgrade (dpkg conf-file handling).
conf-files = [
    "/etc/snakeway/snakeway.hcl",
    "/etc/snakeway/device.d/structured_logging.hcl",
    "/etc/snakeway/ingress.d/example.hcl",
]

# ---------------------------------------------------------------------------
# Build a .rpm package (cargo-generate-rpm)
#   cargo install cargo-generate-rpm
#   cargo generate-rpm -p snakeway [--target x86_64-unknown-linux-musl]
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/snakeway", dest = "/usr/bin/snakeway", mode = "755" },
    { source = "../../packaging/config/snakeway.hcl", dest = "/etc/snakeway/snakeway.hcl", mode = "644", config = true },
    { source = "../../packaging/config/device.d/structured_logging.hcl", dest = "/etc/snakeway/device.d/structured_logging.hcl", mode = "644", config = true },
    { source = "../../packaging/config/ingress.d/example.hcl", dest = "/etc/snakeway/ingress.d/example.hcl", mode = "644", config = true },
    { source = "../../packaging/systemd/snakeway.service", dest = "/usr/lib/systemd/system/snakeway.service", mode = "644" },
]

pre_install_script = """\
getent group  snakeway > /dev/null 2>&1 || groupadd --system snakeway
getent passwd snakeway > /dev/null 2>&1 || \
  useradd --system --no-create-home --gid snakeway --shell /sbin/nologin snakeway
"""
post_install_script = """\
install -d -m 0750 -o snakeway -g snakeway /run/snakeway
install -d -m 0750 -o snakeway -g snakeway /var/log/snakeway
install -d -m 0755 /etc/snakeway/ingress.d
install -d -m 0755 /etc/snakeway/device.d
systemctl daemon-reload
"""
pre_uninstall_script = """\
systemctl stop    snakeway.service 2>/dev/null || true
systemctl disable snakeway.service 2>/dev/null || true
"""

[package.metadata.generate-rpm.requires]
systemd = "*"
