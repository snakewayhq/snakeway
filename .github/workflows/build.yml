name: Snakeway CI

permissions:
  contents: write
  packages: write
  checks: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate (lint, unit test, integration test)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"   # Enables GitHub Actions cache backend
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure test hostname
        run: echo "127.0.0.1 snakeway.test" | sudo tee -a /etc/hosts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y mold protobuf-compiler

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      # Format check.
      - name: cargo fmt
        run: cargo fmt -- --check

      # Lint check.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Unit test check.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (snakeway-core / snakeway-conf)
        run: |
          cargo nextest run \
            -p snakeway-conf \
            -p snakeway-core \
            --all-features \
            --profile ci

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Tests

      # Integration test check.
      - name: Generate TLS test certificates
        run: bash ./dev/gen-test-certs.sh

      - name: Start Pebble (ACME test server)
        run: docker compose -f docker-compose-dev.yml up pebble -d --remove-orphans

      - name: Wait for Pebble to be ready
        run: |
          set -euo pipefail
          echo "Polling Pebble ACME directory at https://localhost:14000/dir ..."
          for i in $(seq 1 30); do
            if curl --silent --fail --insecure \
                --output /dev/null \
                https://localhost:14000/dir 2>/dev/null; then
              echo "Pebble is ready (attempt ${i}/30)"
              exit 0
            fi
            echo "  attempt ${i}/30 — not ready yet, sleeping 2s"
            sleep 2
          done
          echo "::error::Pebble did not become ready within 60 seconds"
          docker compose -f docker-compose-dev.yml logs pebble
          exit 1

      - name: Fetch Pebble CA certificate
        run: |
          mkdir -p tests/integration/certs
          docker cp snakeway-pebble:/test/certs/pebble.minica.pem \
            tests/integration/certs/pebble-ca.pem
          openssl x509 -noout -subject \
            -in tests/integration/certs/pebble-ca.pem

      - name: Run integration tests
        run: cargo nextest run -p integration --profile ci

      - name: Publish integration test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Integration Tests

      - name: Generate integration test badge
        if: always()
        run: |
          INTEG=$(grep -c '<testcase ' target/nextest/ci/junit.xml 2>/dev/null || echo 0)
          mkdir -p integration-badge
          jq -n --arg total "$INTEG" \
            '{schemaVersion:1,label:"integration tests",message:($total+" passed"),color:"brightgreen"}' \
            > integration-badge/integration-tests-badge.json

      - name: Upload integration test badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-badge
          path: integration-badge/

      - name: Tear down Pebble
        if: always()
        run: docker compose -f docker-compose-dev.yml down --volumes --remove-orphans

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov \
            -p snakeway-core -p snakeway-conf -p snakeway \
            --all-features \
            --ignore-filename-regex 'pingora|tests/|examples/' \
            --json --output-path coverage.json

      - name: Generate reports and badges
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex 'pingora|tests/|examples/' \
            --html \
            --output-dir coverage-html
          PCT=$(jq '.data[0].totals.lines.percent | . * 10 | floor | . / 10' coverage.json)
          echo "COVERAGE_PCT=${PCT}" >> "$GITHUB_ENV"
          echo "## Coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg pct "$PCT" \
            '{schemaVersion:1,label:"coverage",message:($pct+"%"),color:(if ($pct|tonumber)>=80 then "brightgreen" elif ($pct|tonumber)>=60 then "yellow" else "red" end)}' \
            > coverage-html/badge.json

      - name: Count tests and generate badge
        run: |
          UNIT=$(cargo test -p snakeway-core -p snakeway-conf -p snakeway --all-features -- --list 2>/dev/null | grep -c ': test$' || echo 0)
          echo "## Tests: ${UNIT}" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg total "$UNIT" '{schemaVersion:1,label:"tests",message:($total+" passed"),color:"brightgreen"}' \
            > coverage-html/tests-badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/

  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [ validate ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        variant:
          - name: default
            features: ""
          - name: wasm
            features: "--features wasm"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.12.0"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant.name }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build with zigbuild
        run: cargo zigbuild --profile dist --locked --target ${{ matrix.target }} ${{ matrix.variant.features }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: snakeway-${{ matrix.target }}-${{ matrix.variant.name }}
          path: target/${{ matrix.target }}/dist/snakeway

  release:
    name: Create release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -e
          ls -lh dist
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway

      - name: Rename release binaries
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mv dist/snakeway-x86_64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl
          mv dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl-wasm
          mv dist/snakeway-aarch64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl
          mv dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl-wasm

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          shasum -a 256 snakeway-v*-linux-musl* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl-wasm
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl-wasm
            dist/SHA256SUMS
