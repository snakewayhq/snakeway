name: Snakeway CI

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit tests (nextest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (snakeway-core)
        run: |
          cargo nextest run \
            -p snakeway-core \
            --features static_files,wasm

  integration-test:
    name: Integration tests (Pebble / ACME)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # snakeway.test is the canonical test hostname used as Host header, SNI, and listener
      # address throughout the integration test suite.  It must resolve to loopback so that
      # Pingora can bind to it and reqwest can connect to it.
      - name: Configure test hostname
        run: echo "127.0.0.1 snakeway.test" | sudo tee -a /etc/hosts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Use a dedicated cache key so this job's compiled artifacts (integration-tests crate
      # and its unique dependencies such as tonic, reqwest) are stored separately from the
      # unit-test job's cache.  Both jobs run in parallel after lint, so sharing a single key
      # would cause last-writer-wins cache collisions with no benefit.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      # Generate the non-ACME TLS material (server.pem, server.key, origin-ca.pem).
      # These certificates are created by our own test CA and are used by the proxy
      # tests that exercise manual TLS termination.  They do not depend on Pebble.
      - name: Generate TLS test certificates
        run: bash ./gen-test-certs.sh

      # Reuse the same docker-compose-dev.yml that developers use locally so that
      # CI behaviour is identical to local behaviour.  --remove-orphans ensures a
      # clean slate on re-runs without requiring an explicit down step beforehand.
      - name: Start Pebble (ACME test server)
        run: docker compose -f docker-compose-dev.yml up -d --remove-orphans

      # Pebble takes a moment to generate its ephemeral CA and start its HTTPS
      # listener.  We poll the ACME directory endpoint (which is the same URL
      # the cert-manager uses) so the readiness check exercises the real path.
      # 30 attempts × 2 s = 60 s maximum wait; failure is surfaced immediately
      # with container logs so the root cause is visible in the CI run.
      - name: Wait for Pebble to be ready
        run: |
          set -euo pipefail
          echo "Polling Pebble ACME directory at https://localhost:14000/dir ..."
          for i in $(seq 1 30); do
            if curl --silent --fail --insecure \
                --output /dev/null \
                https://localhost:14000/dir 2>/dev/null; then
              echo "Pebble is ready (attempt ${i}/30)"
              exit 0
            fi
            echo "  attempt ${i}/30 — not ready yet, sleeping 2s"
            sleep 2
          done
          echo "::error::Pebble did not become ready within 60 seconds"
          docker compose -f docker-compose-dev.yml logs pebble
          exit 1

      # The integration tests configure instant-acme with Pebble's self-signed CA
      # so that TLS connections to the ACME directory are trusted.  We fetch this
      # cert from the running container (same as `just fetch-pebble-ca` locally).
      # A quick openssl sanity-check ensures the file is a valid PEM certificate
      # before we proceed to run the tests.
      - name: Fetch Pebble CA certificate
        run: |
          mkdir -p integration-tests/certs
          docker cp snakeway-pebble:/test/certs/pebble.minica.pem \
            integration-tests/certs/pebble-ca.pem
          openssl x509 -noout -subject \
            -in integration-tests/certs/pebble-ca.pem

      - name: Run integration tests
        run: cargo nextest run -p integration-tests

      # Always tear down containers, even when tests fail, to prevent port and
      # resource leaks between CI runs on the same runner.  --volumes removes
      # any anonymous volumes created by the Pebble container.
      - name: Tear down Pebble
        if: always()
        run: docker compose -f docker-compose-dev.yml down --volumes --remove-orphans

  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        variant:
          - name: default
            features: ""
          - name: wasm
            features: "--features wasm"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.12.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant.name }}

      - name: Cache cargo-zigbuild
        id: cache-zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}
          restore-keys: cargo-zigbuild-${{ runner.os }}

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: Build with zigbuild
        run: cargo zigbuild --profile dist --locked --target ${{ matrix.target }} ${{ matrix.variant.features }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: snakeway-${{ matrix.target }}-${{ matrix.variant.name }}
          path: target/${{ matrix.target }}/dist/snakeway

  release:
    name: Create release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -e
          ls -lh dist
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway

      - name: Rename release binaries
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mv dist/snakeway-x86_64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl
          mv dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl-wasm
          mv dist/snakeway-aarch64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl
          mv dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl-wasm

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          shasum -a 256 snakeway-v*-linux-musl* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl-wasm
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl-wasm
            dist/SHA256SUMS
