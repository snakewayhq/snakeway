name: Snakeway CI

permissions:
  contents: write
  packages: write
  checks: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit tests (nextest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (snakeway-core / snakeway-conf)
        run: |
          cargo nextest run \
            -p snakeway-conf \
            -p snakeway-core \
            --features static_files,wasm \
            --profile ci

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Tests

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure test hostname
        run: echo "127.0.0.1 snakeway.test" | sudo tee -a /etc/hosts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [ test, integration-test ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        variant:
          - name: default
            features: ""
          - name: wasm
            features: "--features wasm"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.12.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant.name }}

      - name: Cache cargo-zigbuild
        id: cache-zigbuild
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ runner.os }}
          restore-keys: cargo-zigbuild-${{ runner.os }}

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: Build with zigbuild
        run: cargo zigbuild --profile dist --locked --target ${{ matrix.target }} ${{ matrix.variant.features }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: snakeway-${{ matrix.target }}-${{ matrix.variant.name }}
          path: target/${{ matrix.target }}/dist/snakeway

  release:
    name: Create release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -e
          ls -lh dist
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway

      - name: Rename release binaries
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mv dist/snakeway-x86_64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl
          mv dist/snakeway-x86_64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl-wasm
          mv dist/snakeway-aarch64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl
          mv dist/snakeway-aarch64-unknown-linux-musl-wasm/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl-wasm

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          shasum -a 256 snakeway-v*-linux-musl* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl-wasm
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl-wasm
            dist/SHA256SUMS
