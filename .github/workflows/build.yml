name: Snakeway CI

permissions:
  contents: write
  packages: write
  checks: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate (lint, unit test, integration test)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"   # Enables GitHub Actions cache backend
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure test hostname
        run: echo "127.0.0.1 snakeway.test" | sudo tee -a /etc/hosts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y mold protobuf-compiler

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: validation

      # Format check.
      - name: cargo fmt
        run: cargo fmt -- --check

      # Lint check.
      - name: cargo clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          # Second pass without benchmarks to catch dead code only kept alive by bench targets.
          cargo clippy --workspace --exclude snakeway-tests --lib --tests --all-features -- -D warnings

      # Unit test check.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (snakeway-core / snakeway-conf)
        run: |
          cargo nextest run \
            -p confval \
            -p confval-derive \
            -p snakeway-conf \
            -p snakeway-core \
            --all-features \
            --profile ci

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Tests

      # Integration test check.
      - name: Generate TLS test certificates
        run: bash ./dev/gen-test-certs.sh

      - name: Start Pebble (ACME test server)
        run: docker compose -f docker-compose-dev.yml up pebble -d --remove-orphans

      - name: Wait for Pebble to be ready
        run: |
          set -euo pipefail
          echo "Polling Pebble ACME directory at https://localhost:14000/dir ..."
          for i in $(seq 1 30); do
            if curl --silent --fail --insecure \
                --output /dev/null \
                https://localhost:14000/dir 2>/dev/null; then
              echo "Pebble is ready (attempt ${i}/30)"
              exit 0
            fi
            echo "  attempt ${i}/30 — not ready yet, sleeping 2s"
            sleep 2
          done
          echo "::error::Pebble did not become ready within 60 seconds"
          docker compose -f docker-compose-dev.yml logs pebble
          exit 1

      - name: Fetch Pebble CA certificate
        run: |
          mkdir -p crates/snakeway-tests/certs
          docker cp snakeway-pebble:/test/certs/pebble.minica.pem \
            crates/snakeway-tests/certs/pebble-ca.pem
          openssl x509 -noout -subject \
            -in crates/snakeway-tests/certs/pebble-ca.pem

      - name: Install cargo-component
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-component

      - name: Build WASM device fixtures
        env:
          # The wasm target links with rust-lld, which does not understand the
          # host mold flag in the job-level RUSTFLAGS.
          # Override it to empty so the wasm build uses its default linker (not mold).
          RUSTFLAGS: ""
        run: |
          cargo component build --release --target wasm32-unknown-unknown -p snakeway-wasm-test-device
          cargo component build --release --target wasm32-unknown-unknown -p snakeway-jwt-auth-device
          mkdir -p crates/snakeway-tests/fixtures/wasm
          cp target/wasm32-unknown-unknown/release/snakeway_wasm_test_device.wasm \
             crates/snakeway-tests/fixtures/wasm/test_device.wasm
          cp target/wasm32-unknown-unknown/release/snakeway_jwt_auth_device.wasm \
             crates/snakeway-tests/fixtures/wasm/jwt_auth_device.wasm

      - name: Run integration tests
        run: cargo nextest run -p snakeway-tests --profile ci

      - name: Publish integration test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Integration Tests

      - name: Generate integration test badge
        if: always()
        run: |
          INTEG=$(grep -c '<testcase ' target/nextest/ci/junit.xml 2>/dev/null || echo 0)
          mkdir -p integration-badge
          jq -n --arg total "$INTEG" \
            '{schemaVersion:1,label:"integration tests",message:($total+" passed"),color:"brightgreen"}' \
            > integration-badge/integration-tests-badge.json

      - name: Upload integration test badge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-badge
          path: integration-badge/

      - name: Tear down Pebble
        if: always()
        run: docker compose -f docker-compose-dev.yml down --volumes --remove-orphans

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "true"   # Enables GitHub Actions cache backend
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: |
          cargo llvm-cov \
            -p confval -p confval-derive -p snakeway-core -p snakeway-conf -p snakeway \
            --all-features \
            --ignore-filename-regex 'pingora|tests/|examples/' \
            --json --output-path coverage.json

      - name: Generate reports and badges
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex 'pingora|tests/|examples/' \
            --html \
            --output-dir coverage-html
          PCT=$(jq '.data[0].totals.lines.percent | . * 10 | floor | . / 10' coverage.json)
          echo "COVERAGE_PCT=${PCT}" >> "$GITHUB_ENV"
          echo "## Coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg pct "$PCT" \
            '{schemaVersion:1,label:"coverage",message:($pct+"%"),color:(if ($pct|tonumber)>=80 then "brightgreen" elif ($pct|tonumber)>=60 then "yellow" else "red" end)}' \
            > coverage-html/badge.json

      - name: Count tests and generate badge
        run: |
          UNIT=$(cargo test -p confval -p confval-derive -p snakeway-core -p snakeway-conf -p snakeway --all-features -- --list 2>/dev/null | grep -c ': test$' || echo 0)
          echo "## Tests: ${UNIT}" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg total "$UNIT" '{schemaVersion:1,label:"tests",message:($total+" passed"),color:"brightgreen"}' \
            > coverage-html/tests-badge.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/

  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [ validate ]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        variant:
          - name: default
            features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.1"

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant.name }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build with zigbuild
        run: cargo zigbuild --profile dist --locked --target ${{ matrix.target }} ${{ matrix.variant.features }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: snakeway-${{ matrix.target }}-${{ matrix.variant.name }}
          path: target/${{ matrix.target }}/dist/snakeway

  docker:
    name: Publish Docker image
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: snakeway-x86_64-unknown-linux-musl-default
          path: dist/linux/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: snakeway-aarch64-unknown-linux-musl-default
          path: dist/linux/arm64

      - name: Make binaries executable
        run: chmod +x dist/linux/amd64/snakeway dist/linux/arm64/snakeway

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create release artifacts
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (needed by cargo-deb and cargo-generate-rpm for metadata parsing)
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Verify downloaded artifacts
        run: |
          set -e
          ls -lh dist
          ls -lh dist/snakeway-x86_64-unknown-linux-musl-default/snakeway
          ls -lh dist/snakeway-aarch64-unknown-linux-musl-default/snakeway

      # Stage binaries where cargo-deb and cargo-generate-rpm expect them.
      - name: Stage binaries for packaging
        run: |
          set -e
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            mkdir -p "target/${target}/release"
            cp "dist/snakeway-${target}-default/snakeway" "target/${target}/release/snakeway"
            chmod +x "target/${target}/release/snakeway"
          done

      # Build .deb packages for both architectures.
      - name: Build .deb packages
        run: |
          set -e
          cargo deb -p snakeway --no-build --no-strip \
            --target x86_64-unknown-linux-musl
          cargo deb -p snakeway --no-build --no-strip \
            --target aarch64-unknown-linux-musl

      # Build .rpm packages for both architectures.
      - name: Build .rpm packages
        run: |
          set -e
          cargo generate-rpm -p crates/snakeway \
            --target x86_64-unknown-linux-musl
          cargo generate-rpm -p crates/snakeway \
            --target aarch64-unknown-linux-musl

      - name: Rename release binaries
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mv dist/snakeway-x86_64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-x86_64-linux-musl
          mv dist/snakeway-aarch64-unknown-linux-musl-default/snakeway \
             dist/snakeway-${TAG}-aarch64-linux-musl

      # Collect .deb and .rpm packages into dist/ for release.
      - name: Collect packages
        run: |
          set -e
          cp target/x86_64-unknown-linux-musl/debian/*.deb dist/
          cp target/aarch64-unknown-linux-musl/debian/*.deb dist/
          cp target/x86_64-unknown-linux-musl/generate-rpm/*.rpm dist/
          cp target/aarch64-unknown-linux-musl/generate-rpm/*.rpm dist/

      - name: Generate SHA256 checksums
        run: |
          set -e
          cd dist
          shasum -a 256 snakeway-v*-linux-musl* *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      # GPG sign the checksums file.
      # Requires GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets (Settings > Secrets).
      - name: Import GPG signing key
        run: |
          echo "${{ secrets.PRIVATE_SIGNING_KEY_SNAKEWAY_2026 }}" | gpg --batch --import
      - name: Sign SHA256SUMS
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.SIGNING_PASSPHRASE_SNAKEWAY_2026 }}" \
            --detach-sign --armor \
            --output dist/SHA256SUMS.asc \
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/snakeway-${{ github.ref_name }}-x86_64-linux-musl
            dist/snakeway-${{ github.ref_name }}-aarch64-linux-musl
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
