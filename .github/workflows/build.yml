name: Snakeway CI

permissions:
  contents: write
  packages: write
  checks: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit tests (nextest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit tests (snakeway-core / snakeway-conf)
        run: |
          cargo nextest run \
            -p snakeway-conf \
            -p snakeway-core \
            --features static_files,wasm \
            --profile ci

      - name: Publish unit test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Unit Tests

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure test hostname
        run: echo "127.0.0.1 snakeway.test" | sudo tee -a /etc/hosts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        run: sudo apt-get update -y && sudo apt-get install -y mold

      - name: Install sccache
        run: cargo install sccache

      - name: Configure sccache
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      # (rest unchanged…)