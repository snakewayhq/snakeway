name: Deploy Docs

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "Snakeway CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download coverage report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download \
            --repo ${{ github.repository }} \
            --name coverage-html \
            --dir static/coverage \
            || echo "::warning::No coverage artifact found; skipping."

      - name: Download integration test badge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download \
            --repo ${{ github.repository }} \
            --name integration-badge \
            --dir static/coverage \
            || echo "::warning::No integration badge artifact found; skipping."

      - name: Build site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
